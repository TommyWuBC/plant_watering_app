  <text x="80" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#5c584f">A SwiftUI tracker that sorts your plants by who's thirstiest.</text>
  <text x="80" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#5c584f">SWIFTUI · MVVM · IOS 17</text>

